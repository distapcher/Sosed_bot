[project]
name = "sosed-telegram-bot"
version = "0.1.0"
description = "Telegram bot 'Sosed' with an AI brain"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "You" }]
dependencies = [
  "python-telegram-bot>=21.0",
  "python-dotenv>=1.0.1",
  "openai>=1.40.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "jinja2>=3.1.0",
  "yookassa>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
