services:
  - type: worker
    name: sosed-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MAX_HISTORY_MESSAGES
        value: "12"
      - key: MAX_OUTPUT_TOKENS
        value: "600"

