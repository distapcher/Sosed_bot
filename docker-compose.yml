services:
  sosed:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - sosed-data:/data

  web:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "src.web"]
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - sosed-data:/data
    depends_on:
      - sosed

volumes:
  sosed-data:
