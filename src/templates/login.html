<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сосед — вход</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #eee;
    }
    .card {
      width: 100%;
      max-width: 360px;
      padding: 2rem;
      background: #16213e;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
    p { margin: 0 0 1.5rem; color: #aaa; font-size: .9rem; }
    label { display: block; margin-bottom: .35rem; font-size: .85rem; color: #bbb; }
    input {
      width: 100%;
      padding: .65rem .75rem;
      margin-bottom: 1rem;
      border: 1px solid #334;
      border-radius: 8px;
      background: #0f3460;
      color: #fff;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: .75rem;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #c73e54; }
    .error {
      margin-bottom: 1rem;
      padding: .6rem .75rem;
      background: rgba(233, 69, 96, .15);
      border: 1px solid #e94560;
      border-radius: 8px;
      color: #ffb4c0;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Сосед</h1>
    <p>Статистика бота</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
